<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Student Profile Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> My Student Profile </h1>
    <div id="profile-container"></div>
    
    <h1 id="welcomeMessage">Welcome!</h1>
    <input id="nameInput" type="text" placeholder="Enter your name...">

    <form id="studentForm">
        <input id="courseInput" type="text" placeholder="Enter your course...">
       
        <div class="button-row">
            <button type="submit">Register</button>
            <button type="button" id="themeButton">Toggle Theme</button>
        </div>      
    </form>

    <p id="registrationMessage"></p>

    <script src="script.js"></script>

</body>
</html>
